# 社名・プロダクト名・技術用語の表記辞書（textlint-rule-prh）
#
# expected が正しい表記、patterns が直したい表記です。
# URL やコードに含まれる小文字表記（github.com など）を誤検出しないよう、
# patterns には大文字・小文字が混ざった誤表記だけを書きます。
# 自社の社名やプロダクト名は「自社の表記」に追記してください。
version: 1
rules:
  # --- 自社の表記 ---
  # 社名
  - expected: 株式会社LangCore
    patterns:
      - 株式会社 LangCore
      - LangCore株式会社
      - LangCore 株式会社
      - (株)LangCore
      - （株）LangCore
  - expected: LangCore
    patterns:
      - Langcore
      - LANGCORE
      - ラングコア

  # プロダクト・サービス名（LangCore のあとは必ず半角スペース）
  - expected: LangCore Operator
    patterns:
      - LangCoreOperator
      - LangCore operator
      - LangCoreoperator
  - expected: LangCore First Deploy
    patterns:
      - LangCoreFirst Deploy
      - LangCoreFirstDeploy
      - LangCore FirstDeploy
      - LangCore First deploy
      - LangCore first deploy
  - expected: LangCore Agent Deploy
    patterns:
      - LangCoreAgent Deploy
      - LangCore AgentDeploy
      - LangCoreAgentDeploy
      - LangCore Agent deploy
      - LangCore agent deploy

  # --- サービス・ツール名 ---
  - expected: GitHub
    patterns:
      - Github
      - GitHUB
  - expected: GitHub Actions
    patterns:
      - GitHub actions
      - Github Actions
  - expected: GitLab
    patterns:
      - Gitlab
  - expected: Slack
    patterns:
      - SLACK
  - expected: Notion
    patterns:
      - NOTION
  - expected: Figma
    patterns:
      - FIGMA
  - expected: Claude Code
    patterns:
      - Claude code
      - ClaudeCode
  - expected: ChatGPT
    patterns:
      - ChatGpt
      - chatGPT
      - Chat GPT

  # --- 言語・技術 ---
  - expected: JavaScript
    patterns:
      - Javascript
      - JAVASCRIPT
  - expected: TypeScript
    patterns:
      - Typescript
      - TYPESCRIPT
  - expected: Next.js
    patterns:
      - NextJS
      - Nextjs
      - NextJs
  - expected: Node.js
    patterns:
      - NodeJS
      - Nodejs
      - NodeJs
  - expected: PostgreSQL
    patterns:
      - Postgresql
      - PostgreSql
  - expected: MySQL
    patterns:
      - Mysql
      - MYSQL
  - expected: AWS
    patterns:
      - Aws
  - expected: Google Cloud
    patterns:
      - google cloud
  - expected: iOS
    patterns:
      - IOS
      - Ios
